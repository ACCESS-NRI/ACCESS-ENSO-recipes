# ESMValTool
# 
---
documentation:
  description: equatorial IO bias and seasonal cycles based on ENSO climatology recipes 
  title: IOD climatology
  authors:
    - chun_felicity
  maintainer:
    - chun_felicity

datasets:
  - {dataset: ACCESS-ESM1-5, project: CMIP6, exp: historical, ensemble: r1i1p1f1, grid: gn, start_year: 1950, end_year: 2014}
  # - {dataset: ACCESS-CM2, project: CMIP6, exp: historical, ensemble: r1i1p1f1, grid: gn, start_year: 1950, end_year: 2014}


preprocessors:
  base_bias: &base_bias
    custom_order: true
    mask_landsea:
      mask_out: land # search for supplementary sftlf, sftof
    climate_statistics:
      operator: mean
      period: full
    regrid:
      target_grid: 1x1
      scheme: linear
    extract_region: &eq_indian
      start_longitude: 50.
      end_longitude: 110.
      start_latitude: -25.
      end_latitude: 25.
  
  eq_bias:
    <<: *base_bias
    extract_region: &eq_region
      start_longitude: 50.
      end_longitude: 110.
      start_latitude: -10.
      end_latitude: 10.
    meridional_statistics: #axis y
      operator: mean
  
  base_cycle: &base_cycle
    <<: *base_bias
    climate_statistics:
      operator: mean
      period: monthly
  
  eq_sea_cycle:
    <<: *base_cycle
    extract_region: 
      <<: *eq_region
    # meridional_statistics: #axis y # done in diag script
    #   operator: mean

diagnostics:
  diagnostic_metrics:
    description: run preprocessors on variables for level1 climatology
    variables:
      eq_pr_bias:
        short_name: pr
        preprocessor: eq_bias
        mip: Amon
        additional_datasets:
          - {dataset: GPCP-SG, project: OBS, type: sat, tier: 2, mip: Amon, start_year: 1979, end_year: 2018}
      eq_sst_bias:
        short_name: ts
        preprocessor: eq_bias
        mip: Amon
        additional_datasets:
          - {dataset: HadISST, project: OBS, type: reanaly, tier: 2, mip: Amon}
      eq_tauu_bias:
        short_name: tauu
        preprocessor: eq_bias
        mip: Amon
        additional_datasets:
         - {dataset: ERA-Interim, project: OBS6, type: reanaly, tier: 3, mip: Amon, start_year: 1979, end_year: 2018}

      eq_pr_seacycle:
        short_name: pr
        preprocessor: eq_sea_cycle
        mip: Amon
        additional_datasets:
          - {dataset: GPCP-SG, project: OBS, type: sat, tier: 2, mip: Amon, start_year: 1979, end_year: 2018}
      eq_sst_seacycle:
        short_name: tos
        preprocessor: eq_sea_cycle
        mip: Omon
        additional_datasets:
          - {dataset: HadISST, project: OBS, type: reanaly, tier: 2, mip: Omon}
      eq_tauu_seacycle:
        short_name: tauu
        preprocessor: eq_sea_cycle
        mip: Amon
        additional_datasets:
         - {dataset: ERA-Interim, project: OBS6, type: reanaly, tier: 3, mip: Amon, start_year: 1979, end_year: 2018}
    scripts:
      plot_level1:
        script: diagnostic_scripts/climatology_diagnostic1.py
        # script: /home/189/fc6164/esmValTool/repos/ENSO_recipes/recipe_diagnostics/diagnostic_scripts/climatology_diagnostic1.py

  dive_downs:
    description: run preprocessors on variables for level 2 and 3 climatology
    variables:
      pr_bias:
        short_name: pr
        preprocessor: base_bias
        mip: Amon
        additional_datasets:
          - {dataset: GPCP-SG, project: OBS, type: sat, tier: 2, mip: Amon, start_year: 1979, end_year: 2018}
      sst_bias:
        short_name: ts
        preprocessor: base_bias
        mip: Amon
        additional_datasets:
          - {dataset: HadISST, project: OBS, type: reanaly, tier: 2, mip: Amon}
      tauu_bias:
        short_name: tauu
        preprocessor: base_bias
        mip: Amon
        additional_datasets:
         - {dataset: ERA-Interim, project: OBS6, type: reanaly, tier: 3, mip: Amon, start_year: 1979, end_year: 2018}
      pr_seacycle:
        short_name: pr
        preprocessor: base_cycle
        mip: Amon
        additional_datasets:
          - {dataset: GPCP-SG, project: OBS, type: sat, tier: 2, mip: Amon, start_year: 1979, end_year: 2018}
      sst_seacycle:
        short_name: ts
        preprocessor: base_cycle
        mip: Amon
        additional_datasets:
          - {dataset: HadISST, project: OBS, type: reanaly, tier: 2, mip: Amon}
      tauu_seacycle:
        short_name: tauu
        preprocessor: base_cycle
        mip: Amon
        additional_datasets:
         - {dataset: ERA-Interim, project: OBS6, type: reanaly, tier: 3, mip: Amon, start_year: 1979, end_year: 2018}
    scripts:
      level2_map:
        script: diagnostic_scripts/climatology_diagnosticlevel2.py
        figsize: [20, 10]
        cenlon: 50.0
      level3_hovmoller_months:
        script: diagnostic_scripts/climatology_diagnosticlevel3.py
        iod: true


